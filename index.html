<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Pribadi</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h3>AI Chat Pribadi</h3>
      <div class="actions">
        <button id="theme" title="Ganti tema">🌓</button>
        <button id="clear">Chat baru</button>
      </div>
    </header>
    <input id="password" type="password" placeholder="Password">
    <div id="chat"></div>
    <div class="bar">
      <input id="input" placeholder="Ketik pesan...">
      <button id="send">Kirim</button>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
