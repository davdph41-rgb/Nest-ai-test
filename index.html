<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEX AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>NEX AI</h1>
      <span>Personal Assistant</span>
    </div>
  </div>
  <button id="clearBtn">＋</button>
</header>

<main id="chat">
  <div class="welcome">
    <div class="big-logo">N</div>
    <h2>How can I help?</h2>
    <p>Ask me anything.</p>

    <div class="suggestions">
      <button>💡 Beri aku ide project</button>
      <button>📝 Buatkan task untuk hari ini</button>
      <button>💻 Bantu aku coding</button>
    </div>
  </div>
</main>

<form id="chatForm">
  <textarea id="message" placeholder="Message NEX AI..." rows="1"></textarea>
  <button id="sendBtn" type="submit">↑</button>
</form>

</div>

<script src="script.js"></script>
</body>
</html>
